<head>
{% include head.html %}

<script src="https://cdn.counter.dev/script.js" data-id="4c8f7caa-2b55-46cd-a995-2c4633303773" data-utcoffset="8"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T5N5JY1E21"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-T5N5JY1E21');
</script>

<style>
  /* 通用样式 */
  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: white;
    flex-wrap: nowrap; /* 禁止换行 */
  }

  /* Logo 样式 */
  .logo {
    width: 200px;
    height: auto;
    flex-shrink: 0; /* 禁止缩小 */
    margin-left: 20px;
  }

  /* 导航栏容器 */
  .nav-wrapper {
    flex: 1;
    min-width: 60%; /* 保证导航栏最小宽度 */
    overflow-x: auto; /* 小屏允许横向滚动 */
  }

  /* 移动端适配 */
  @media (max-width: 768px) {
    .header-container {
      padding: 10px 15px;
    }
    
    .logo {
      width: 150px; /* 缩小Logo尺寸 */
      margin-left: 10px;
    }

    /* 导航栏项适配 */
    .nav-wrapper ul {
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    
    .nav-wrapper li {
      font-size: 0.9em; /* 缩小字体 */
      padding: 0 8px; /* 调整间距 */
    }
  }

  /* 超小屏幕适配 */
  @media (max-width: 480px) {
    .logo {
      width: 100px;
    }
    .nav-wrapper li {
      font-size: 0.8em;
      padding: 0 5px;
    }
  }
</style>

</head>

<body class="page" itemscope itemtype="http://schema.org/WebPage">
  {% include chrome-frame.html %}

  <div class="header-container">
    <div class="nav-wrapper">
      {% include navigation.html %}
    </div>
    <img src="/images/pennlogo.png" class="logo" alt="UPenn Logo">
  </div>

  <!-- 其他内容保持不变 -->
  {% if page.image.feature %}<div class="image-wrap">
    <img src="{{ site.url }}/images/{{ page.image.feature }}" alt="{{ page.title }} feature image" itemprop="primaryImageOfPage">
  </div>{% endif %}

  <div id="main" role="main" itemprop="mainContentOfPage">
    <div class="article-author-top">
      {% include author-bio.html %}
    </div>
    <article itemscope itemtype="http://schema.org/CreativeWork">
      <div class="article-wrap" itemprop="text">
        {{ content }}
      </div>
    </article>
  </div>

  <div class="footer-wrap">
    <footer>
      {% include footer.html %}
    </footer>
  </div>

  {% include scripts.html %}
</body>
</html>
